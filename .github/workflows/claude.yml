name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.author_association, 'OWNER')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.author_association, 'MEMBER')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.author_association, 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.author_association, 'OWNER')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.author_association, 'MEMBER')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.author_association, 'COLLABORATOR')) ||
      (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'shafiqgemc' || github.event.pull_request.user.login == 'BI-KnowledgeAnalytics')) ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Edit,Bash,Read,Write"
